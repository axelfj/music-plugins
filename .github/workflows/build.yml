name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin to release (folder name under plugins/)"
        required: true
        default: ClipReady
      version:
        description: "Release version, e.g. 1.0.0-alpha.1 (must equal the plugin's VERSION file)"
        required: true

permissions:
  contents: write

# A new push to a PR cancels the run still going for the previous head. Releases (workflow_dispatch)
# are keyed by plugin so several can be dispatched at once without cancelling each other's queue;
# main pushes are never cancelled.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}-${{ inputs.plugin }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_TYPE: Release

jobs:
  tests:
    name: DSP tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DMUSIC_PLUGINS_BUILD_PLUGINS=OFF
      - name: Build
        run: cmake --build build-tests --config ${{ env.BUILD_TYPE }} --parallel 4
      - name: Run
        run: ctest --test-dir build-tests -C ${{ env.BUILD_TYPE }} --output-on-failure

  plugins:
    name: Plugins (${{ matrix.name }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            pluginval: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          - name: macOS
            os: macos-latest
            pluginval: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          - name: Linux
            os: ubuntu-latest
            pluginval: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev

      - name: Cache dependencies (JUCE, CLAP, Catch2)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      # Every plugin compiles its own copy of the JUCE modules; ccache makes the second run of an
      # unchanged plugin nearly free (Linux / macOS; MSVC is left alone).
      - name: ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}
          max-size: 1G

      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then extra='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'; fi
          if [ "$RUNNER_OS" != "Windows" ]; then extra="$extra -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DMUSIC_PLUGINS_BUILD_TESTS=OFF $extra

      # An explicit job count: "--parallel" alone means unlimited with Makefiles, and with several
      # plugins the Linux runner ran out of memory compiling JUCE many times at once.
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Validate with pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "${{ matrix.pluginval }}"
          unzip -q pluginval.zip -d pluginval
          if [ "$RUNNER_OS" = "macOS" ]; then PV=pluginval/pluginval.app/Contents/MacOS/pluginval
          elif [ "$RUNNER_OS" = "Windows" ]; then PV=pluginval/pluginval.exe
          else PV=pluginval/pluginval; chmod +x $PV; fi
          # pluginval occasionally segfaults while tearing down the in-process plugin (seen on
          # Linux): sometimes after it has printed its verdict, sometimes just before, with every
          # test group already completed. Judge the run by the verdict in its output, not the exit
          # code; a crash with no verdict and no failed test is retried (up to 3 attempts), a
          # reported failure is final.
          validate() {
            echo "== $1"
            for attempt in 1 2 3; do
              set +e
              "$PV" --strictness-level 10 --validate-in-process --skip-gui-tests --validate "$1" 2>&1 | tee pluginval.log
              set -e
              if grep -qE "^FAILURE|^\*\*\* FAILED|!!! Test" pluginval.log; then
                echo "::error::pluginval reported a failure for $1"; exit 1
              elif grep -q "^SUCCESS" pluginval.log; then
                echo "pluginval: SUCCESS for $1"; return 0
              fi
              echo "::warning::pluginval exited without a verdict for $1 (attempt $attempt), retrying"
            done
            echo "::error::pluginval did not report SUCCESS for $1"; exit 1
          }
          shopt -s nullglob
          for p in build/plugins/*/*_artefacts/${{ env.BUILD_TYPE }}/VST3/*.vst3; do
            validate "$p"
          done
          # macOS only finds Audio Units that are installed in a Components folder.
          if [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p ~/Library/Audio/Plug-Ins/Components
            for p in build/plugins/*/*_artefacts/${{ env.BUILD_TYPE }}/AU/*.component; do
              cp -R "$p" ~/Library/Audio/Plug-Ins/Components/
              killall -9 AudioComponentRegistrar 2>/dev/null || true
              validate ~/Library/Audio/Plug-Ins/Components/"$(basename "$p")"
            done
          fi

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($dir in Get-ChildItem plugins -Directory) {
            $name = $dir.Name
            $version = (Get-Content "plugins/$name/VERSION" -First 1).Trim()
            $art = Get-ChildItem "build/plugins/$name" -Directory -Filter "*_artefacts" | Select-Object -First 1
            # The .vst3 is a folder, so BaseName would keep the extension.
            $product = (Get-ChildItem "$($art.FullName)/${{ env.BUILD_TYPE }}/VST3" -Filter "*.vst3" | Select-Object -First 1).Name -replace '\.vst3$', ''
            "Packaging $product $version"
            $iscc = @("/DPluginName=$product", "/DPluginFile=$($product -replace ' ', '')", "/DPluginSlug=$name", "/DPluginVersion=$version", "/DArtefacts=$($art.FullName)\${{ env.BUILD_TYPE }}")
            if (Test-Path "plugins/$name/FORMER_NAMES") {
              $former = (Get-Content "plugins/$name/FORMER_NAMES" -First 1).Trim()
              if ($former) { $iscc += "/DFormerName=$former" }
            }
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @iscc installer\windows\plugin.iss
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-ChildItem dist

      - name: Package (macOS pkg)
        if: runner.os == 'macOS'
        run: installer/macos/build-pkg.sh build ${{ env.BUILD_TYPE }} dist

      - name: Package (Linux tarball)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          for dir in plugins/*/; do
            name=$(basename "$dir"); version=$(head -n1 "$dir/VERSION")
            art=$(ls -d build/plugins/$name/*_artefacts | head -n1)/${{ env.BUILD_TYPE }}
            product=$(basename "$art"/VST3/*.vst3 .vst3)
            tar -C "$art" -czf "dist/${product// /}-$version-linux-x86_64.tar.gz" VST3 CLAP
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    name: Release ${{ inputs.plugin }} ${{ inputs.version }}
    if: github.event_name == 'workflow_dispatch'
    needs: plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check version and collect files
        id: prep
        run: |
          plugin="${{ inputs.plugin }}"; version="${{ inputs.version }}"
          base=$(head -n1 "plugins/$plugin/VERSION")
          if [ "$version" != "$base" ]; then echo "::error::$version does not match plugins/$plugin/VERSION ($base); bump VERSION first"; exit 1; fi
          slug=$(echo "$plugin" | sed -E 's/([a-z0-9])([A-Z])/\1-\2/g' | tr '[:upper:]' '[:lower:]')
          echo "tag=$slug-v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Release title = the product name the DAW shows (NAME in the plugin's CMakeLists.txt), e.g. "EQ-R".
          product=$(sed -nE 's/^ *NAME "([^"]+)".*/\1/p' "plugins/$plugin/CMakeLists.txt" | head -n1)
          echo "title=$product $version" >> "$GITHUB_OUTPUT"
          # Download files are named after the product without spaces, e.g. "PitchDelay-R-Setup-1.0.0-alpha.2.exe".
          file="${product// /}"
          mkdir -p release
          find artifacts -type f -name "$file-*" -exec cp {} release/ \;
          ls -l release
          # Every file announced in the notes must exist among the assets.
          for f in "$file-Setup-$version.exe" "$file-$version.pkg" "$file-$version-linux-x86_64.tar.gz"; do
            [ -f "release/$f" ] || { echo "::error::missing asset $f"; exit 1; }
          done
          python3 - "$plugin" "$version" "$file" <<'EOF'
          import re, sys
          plugin, version, file = sys.argv[1:]
          text = open(f"plugins/{plugin}/CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[?%s\]?.*?$(.*?)(?=^## |\Z)" % re.escape(version), text, re.M | re.S)
          notes = (m.group(1).strip() if m else "") + (
              "\n\n### Descarga / Download\n\n"
              f"- Windows: `{file}-Setup-{version}.exe` (VST3 + CLAP)\n"
              f"- macOS: `{file}-{version}.pkg` (VST3 + AU + CLAP, Intel y Apple silicon)\n"
              f"- Linux: `{file}-{version}-linux-x86_64.tar.gz`\n\n"
              "Los instaladores todavia no estan firmados. En macOS, el README explica como abrirlos la primera vez. / "
              "The installers are not code-signed yet; see the README for the first-launch steps on macOS.\n")
          open("notes.md", "w", encoding="utf-8").write(notes)
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.prep.outputs.title }}
          prerelease: ${{ steps.prep.outputs.prerelease == 'true' }}
          body_path: notes.md
          files: release/*
